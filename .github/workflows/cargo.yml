# Checks every commit: format, lint, tests and a release build.
# The same check as before a commit: cargo fmt && cargo clippy --all-targets && cargo test.
name: cargo

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # A PR from a branch of this repo is already checked by its push.
    # Run on pull_request only for PRs from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # --locked: Cargo.lock pins glass_pumpkin 2.0.0-rc0, see AGENTS.md.
      - name: Release build
        run: cargo build --release --locked
