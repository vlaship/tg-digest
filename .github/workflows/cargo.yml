# Checks every commit: format, lint and a release build.
# The same check as before a commit: cargo fmt && cargo clippy --all-targets.
name: cargo

# Only push, no pull_request: a PR branch is already checked by its push. A second,
# skipped `check` on the same commit would count as passed for the required check
# on main and could let a broken PR merge.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # --locked: Cargo.lock pins glass_pumpkin 2.0.0-rc0, see AGENTS.md.
      - name: Release build
        run: cargo build --release --locked
