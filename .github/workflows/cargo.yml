# Checks every commit on a branch: format, lint and a release build.
#
# It also runs on main, but only to save the build cache. A branch can read the
# cache of main and its own, not the cache of another branch. Without a cache on
# main every new branch built everything from zero (4 minutes, not 1.5) and then
# saved its own 400 MB copy.
name: cargo

# Only push, no pull_request: a PR branch is already checked by its push. A second,
# skipped `check` on the same commit would count as passed for the required check
# on main and could let a broken PR merge.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cargo-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version is rust-toolchain.toml. @stable would move and a new lint
      # would fail this job with no code change. Keep the ref in step with the file.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      # Only main saves the cache; branches only read it. The job must be the same
      # on main and on a branch: its name is a part of the cache key.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # A later cargo update must not replace the glass_pumpkin pin: rc1 does not
      # build, see AGENTS.md.
      - name: glass_pumpkin pin
        run: grep -A1 'name = "glass_pumpkin"' Cargo.lock | grep -q 'version = "2.0.0-rc0"'

      # --locked: Cargo.lock pins glass_pumpkin 2.0.0-rc0.
      - name: Release build
        run: cargo build --release --locked
