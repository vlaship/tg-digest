# Проверка, что образ собирается. Только сборка: в реестр ничего не пушится.
name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tg-digest:ci
          # Кэш слоёв в GitHub Actions: слой с зависимостями cargo
          # пересобирается только при изменении Cargo.toml / Cargo.lock.
          cache-from: type=gha
          cache-to: type=gha,mode=max
