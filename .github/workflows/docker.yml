# Checks that the image builds. Build only: nothing is pushed to a registry.
name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tg-digest:ci
          # Layer cache in GitHub Actions: the cargo dependency layer
          # is rebuilt only when Cargo.toml or Cargo.lock changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
