# Builds the Docker image.
# - push to main and v* tags: build and push to GitHub Container Registry (ghcr.io);
# - pull request: build only, never push;
# - manual run: build only, unless you tick "publish".
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to ghcr.io
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# One run per ref. Old PR runs are cancelled, but a run on main or a tag is never
# cancelled half way: the next one waits, so every push publishes its own image.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: a push to main gives `latest` and a UTC build time like
      # `20261030-011220`; a push of the git tag v1.2.3 gives only `1.2.3` and `1.2`.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss' tz='UTC'}},enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without these, buildx adds attestation manifests, and ghcr.io shows them
          # as extra untagged "unknown/unknown" versions: one push must give one image.
          provenance: false
          sbom: false
          # Layer cache in GitHub Actions: the cargo dependency layer
          # is rebuilt only when Cargo.toml or Cargo.lock changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
