[package]
name = "tg-digest"
version = "0.1.0"
edition = "2021"
description = "Reads a list of Telegram channels, summarizes them with Claude and posts a digest back to Telegram on a schedule"
license = "MIT"

[dependencies]
# Telegram MTProto (personal account, not the Bot API). The crate is pre-1.0 — the API changes between
# minor versions, check signatures at https://docs.rs/grammers-client/0.10.0/
grammers-client  = { version = "0.10", features = ["html", "parse_invite_link"] }
grammers-session = "0.10"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "sync"] }
# Reading several channels at once, results in the same order (`buffered`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# HTTP client for the Anthropic Messages API (there is no official Rust SDK)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Database: channels, cursors, journal of runs and delivery. The same version that
# grammers-session pulls in, so we do not add a second SQLite to the binary.
libsql = { version = "0.9", default-features = false, features = ["core"] }

# Config and serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Schedule
croner    = "4"
chrono    = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Other
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword          = "7"
rand               = "0.10"

[profile.release]
lto = true
codegen-units = 1
