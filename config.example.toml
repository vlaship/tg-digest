# tg-digest — единая точка настройки.
#
# Штатное место файла — volume контейнера: ./data/config.toml на хосте,
# /data/config.toml внутри. Локально запускать так:
#     cargo run -- --config config.toml preview
#
# config.toml в .gitignore — в репозиторий он не попадает.
# Любое из секретных значений можно вместо файла задать переменной окружения,
# она имеет приоритет над TOML:
#     TG_API_ID, TG_API_HASH, TG_PHONE, ANTHROPIC_API_KEY

# База: каналы, курсоры, журнал прогонов и частей дайджеста.
# Лежит в том же volume, что сессия: незавершённый прогон обязан пережить
# перезапуск контейнера вместе с текстом частей и их random_id.
db_file = "/data/digest.db"

# ---------------------------------------------------------------- расписание --
[schedule]
# Стандартный cron из 5 полей: минута час день месяц день_недели
cron = "0 9 * * *"          # каждый день в 09:00

# IANA-имя таймзоны, в которой считается cron и в которой ставится дата в
# заголовке дайджеста. Без него "09:00" уедет в UTC.
timezone = "America/New_York"

# Если слот был пропущен (контейнер был остановлен, машина спала) — прогнать
# сразу при старте, не дожидаясь следующего. В контейнере это штатный режим.
catch_up = true

# Прогнать один раз сразу при запуске `serve`. Удобно для отладки.
run_on_start = false

# ----------------------------------------------------------------- telegram --
[telegram]
# Получить на https://my.telegram.org → API development tools
api_id   = 0
api_hash = ""
# Номер аккаунта в международном формате. Дефисы, пробелы и скобки можно
# оставить — сервис вычищает их сам перед обращением к Telegram.
phone    = "+1-000-00-00"

# Файл сессии (SQLite). Создаётся командой `tg-digest login`.
# ВНИМАНИЕ: это полный доступ к аккаунту — не коммитить и не копировать наружу.
session_file = "/data/tg.session"

# Имя папки в Telegram, которая задаёт список каналов. Папку собираете руками
# в приложении: добавить канал = перетащить его в папку, убрать = вытащить.
# Папка с авто-правилами («Каналы», «Непрочитанные» и т.п.) отклоняется:
# у неё состав вычисляемый, и синхронизация выключила бы всё разом.
# Ключ можно убрать — тогда каналами управляют только команды /add и /rm.
folder = "Digest"

# Куда постить дайджест: "me" = «Избранное», либо "@my_channel"
destination = "me"

# Окно для нового канала (у которого ещё нет курсора) и для канала после
# /reset. У остальных граница — курсор: канал, который три дня падал, при
# восстановлении отдаст все три дня.
lookback_hours = 24

# ПРЕДОХРАНИТЕЛЬ от чтения всей истории, а не отсечка дайджеста. Если канал
# упёрся в лимит, не дойдя до курсора, он исключается из прогона целиком,
# курсор не двигается и приходит уведомление. Постов молча не теряем.
max_posts_per_channel = 1000

# Посты короче этого — отбрасываем (стикеры, «только медиа», реакции одним словом)
min_post_chars = 30

# Пауза между каналами, чтобы не ловить FLOOD_WAIT
pause_between_channels_ms = 1500

# Сколько часов демон сам добивает недоставленный дайджест. Это политика
# повтора, а не граница безопасности: срок дедупликации random_id у Telegram
# не документирован. За пределами окна повтор делает владелец — /resume.
publish_retry_window_hours = 2

# ---------------------------------------------------------------- anthropic --
[anthropic]
api_key = "sk-ant-..."

# Не дописывать к id суффикс с датой — строка используется как есть.
model  = "claude-opus-5"

# low | medium | high | xhigh | max — глубина рассуждений и расход токенов
effort = "high"

max_tokens = 16000

api_url              = "https://api.anthropic.com/v1/messages"
request_timeout_secs = 600

# ------------------------------------------------------------------ промпты --
# Правятся здесь, без пересборки. Плейсхолдеры в user_template:
#   {{now}} {{lookback_hours}} {{post_count}} {{channel_count}} {{posts}}
[prompts]
system = """
Ты — редактор ежедневного новостного дайджеста по Telegram-каналам.

Правила:
1. Сгруппируй материалы по темам, а не по каналам.
2. Если несколько каналов пишут об ОДНОМ И ТОМ ЖЕ событии — объедини их в ОДИН
   пункт и перечисли все источники в sources. Это главное требование.
3. Не повторяй одну новость в разных темах.
4. Темы упорядочи по значимости: сначала самое важное.
5. Пиши по-русски, по факту, без воды, оценок и рекламных формулировок.
6. В sources указывай только те ссылки, которые реально были во входных данных.
   Не придумывай URL: чужие адреса сервис всё равно выбросит.
7. Пост, помеченный «репост из: …», и пост первоисточника — ОДНА новость.
8. tldr — 5–10 самых важных пунктов одной строкой каждый.
"""

user_template = """
Дайджест за период: последние {{lookback_hours}} ч (по состоянию на {{now}}).
Собрано {{post_count}} постов из {{channel_count}} каналов.

{{posts}}
"""

# Заголовки в опубликованном сообщении. {{date}} — дата в таймзоне из [schedule].
digest_title = "📰 Дайджест за {{date}}"
tldr_title   = "Коротко"

# Инструкция для шага map: когда постов слишком много для одного запроса, они
# сжимаются частями, а потом сводятся этим же system-промптом. Ключ
# необязательный — без него берётся встроенный текст (summarize.rs).
# map_system = """
# Ты сжимаешь ЧАСТЬ ленты каналов — её потом сведут с другими частями.
# Переноси все ссылки из входных данных в sources дословно, ничего не выбрасывай.
# """

# ------------------------------------------------------------------- каналы --
# ТОЛЬКО SEED для пустой базы: при первом запуске эти каналы переносятся в
# базу, дальше правда — в папке Telegram и в базе. Правки здесь после этого
# ничего не меняют; каналами управляют папка, /add, /rm и /sync.
#
# username — без @; для приватного канала вместо username указывается id
# (аккаунт должен быть на него подписан).

# [[channels]]
# username = "durov"
# title    = "Дуров"          # необязательно: подпись в дайджесте

# [[channels]]
# id    = -1001234567890      # приватный канал
# title = "Закрытый канал"
