# tg-digest — all settings in one place.
#
# The normal place for this file is the container volume: ./data/config.toml on
# the host, /data/config.toml inside. To run locally:
#     cargo run -- --config config.toml preview
#
# config.toml is in .gitignore — it never goes into the repository.
# All settings come only from this file, the secrets too.
#
# Channels are not set here: add them with /add in the chat with the bot. The list is
# stored in the database.

# The folder with all state: the database and both session files. In the
# container it is the /data volume. For a local run: "data".
# The three file names below are optional: without them the files are
# digest.db, tg.session and bot.session.
data_dir = "/data"

# Database: channels, cursors, journal of runs and digest parts.
# It is in the same volume as the session: an unfinished run must survive
# a container restart, together with the text of its parts and their random_id.
# A file name inside data_dir, not a path.
# db_file = "digest.db"

# Which model writes the digest, as "provider/model" from [providers] below.
# /model in the bot switches it; this is the default.
model = "gemini/gemini-3.8-flash"

# Where to switch when the model is overloaded or its limit is used up, in this
# order. The bot asks the owner first (/fallback), nothing switches by itself.
fallback = ["openrouter/google/gemma-4-31b-it:free", "anthropic/claude-haiku-5-5"]

# ------------------------------------------------------------------ schedule --
[schedule]
# Standard 5-field cron: minute hour day month weekday
cron = "0 9 * * *"          # every day at 09:00; "0 7,13,17,21 * * *" is four times a day

# IANA time zone name. The cron is calculated in it, and the date in the digest
# title uses it. Without it "09:00" means UTC.
timezone = "America/New_York"

# If a slot was missed (the container was stopped, the computer was asleep),
# run at once on start, do not wait for the next one. This is normal in a container.
catch_up = true

# Run once right after `serve` starts. Useful for debugging.
run_on_start = false

# ----------------------------------------------------------------- telegram --
[telegram]
# Where the bot posts the digest: "bot" = the chat with the bot (you see it there),
# or "@my_channel" — then the bot must be an admin of that channel.
# A theme can have its own place: `destination` in its [[themes]] block.
destination = "bot"

# /add starts a channel from its newest message. This window is used after
# /reset, and for a channel whose newest message could not be read on /add.
# Time window for a channel with no cursor yet and for a channel after
# /reset. For other channels the limit is the cursor: a channel that failed for
# three days gives all three days when it works again.
lookback_hours = 24

# A SAFETY LIMIT against reading the whole history, not a cut of the digest. If a
# channel hits the limit before it reaches the cursor, it is excluded from the run
# completely, its cursor does not move and you get a notification. No posts are
# lost silently.
max_posts_per_channel = 1000

# Posts shorter than this are dropped (stickers, "media only", one-word reactions)
min_post_chars = 30

# Pause before the next channel in each parallel lane, to avoid FLOOD_WAIT
pause_between_channels_ms = 1500

# How many channels are read at the same time. More is faster, but too many can
# bring FLOOD_WAIT from Telegram.
parallel_channels = 5

# After a delivered digest, mark the posts as read in Telegram for your account, so
# the channels do not keep unread counters. Only your account: other users keep
# their own read state.
mark_read = true

# For how many hours the daemon itself retries an undelivered digest. This is a
# retry policy, not a safety limit: Telegram does not document how long it keeps
# random_id for deduplication. After this window the owner retries with /resume.
publish_retry_window_hours = 2

# ------------------------------------------------------------- telegram.app --
# The personal account: it only reads. It collects posts, resolves /add and
# refreshes channel names. The bot logs in with the same api_id and api_hash.
[telegram.app]
# Get them at https://my.telegram.org → API development tools
api_id   = 0
api_hash = ""
# Account phone number in international format. You can keep dashes, spaces and
# brackets — the service removes them before it calls Telegram.
phone    = "+1-000-00-00"

# Session file (SQLite). The `tg-digest login` command creates it.
# WARNING: it gives full access to the account — do not commit it or copy it anywhere.
# A file name inside data_dir, not a path.
# session_file = "tg.session"

# ------------------------------------------------------------- telegram.bot --
# The bot you talk to: you write commands to it, and it writes back the replies,
# the digests and the notifications. The personal account above still reads the
# channels (a bot cannot read channels where it is not an admin).
#
# Create a bot with @BotFather (/newbot) and paste its token here. Then open the
# bot in Telegram and send it /start once: a bot can write to you only after that.
# Only the account from [telegram.app] may give the bot commands. Everyone else is
# ignored.
[telegram.bot]
token = ""

# Bot session (SQLite), created on the first start. No login is needed for a bot.
# A file name inside data_dir, not a path.
# session_file = "bot.session"

# ---------------------------------------------------------------- providers --
# Each provider needs only its key. `model` and `fallback` at the top of this file
# name any model the provider has, as "provider/model id" (the full id, as it is).
# The service reads each provider's model list from its API (once a day) and takes
# the limits from there: the input size and the longest answer. In the bot,
# /models <provider> shows the list and /model switches to any model in it.
#
# A table [providers.<provider>.models."<id>"] is needed only to change a setting
# by hand. A setting can also be set for the whole provider. The order is: the model
# table, the provider's model list, the provider table, the defaults.
#   max_tokens           — the longest answer, in tokens
#   max_input_chars      — above this many characters the posts are condensed in
#                          parts first (map-reduce): more requests, each one smaller
#   request_timeout_secs — how long to wait for one answer (default 600)
#   effort               — anthropic: low | medium | high | xhigh | max;
#                          openai: none | minimal | low | medium | high
#   reasoning            — openrouter only: the model thinks before it answers;
#                          slower, and the thinking counts in max_tokens.
#                          A model that always thinks (glm-5.3-flash) gets it on
#                          even with reasoning = false
#   sort                 — openrouter only: how to choose the host of a model:
#                          price | throughput | latency (not set: OpenRouter
#                          balances price and uptime)
#   ignore               — openrouter only: hosts that never get the request,
#                          e.g. ["Relace", "OpenInference"]
#   quantizations        — openrouter only: only hosts that run the model in one
#                          of these forms, e.g. ["fp8", "bf16"]. The cheapest hosts
#                          often run fp4, and it can answer a big feed with nothing
# Providers you do not use can be left out.

[providers.anthropic]
api_key = "sk-ant-..."
effort  = "high"

# The key is from https://aistudio.google.com/apikey (free tier with limits).
# A Gemini app subscription (AI Pro / Ultra) gives no API access.
[providers.gemini]
api_key = "..."

# One key for many models: https://openrouter.ai/keys
# Free models have ids that end with ":free" (/models openrouter free in the bot).
# They have low daily limits and can be busy too. Only models with response_format
# are in the list. If a model has no strict JSON schema (structured_outputs), the
# service asks for a JSON object and puts the schema in the prompt.
[providers.openrouter]
api_key = "sk-or-..."
# One model has many hosts, and their prices differ up to five times.
sort    = "price"
# The cheapest hosts run strongly compressed models (fp4). Keep them out.
quantizations = ["fp8", "bf16", "fp16"]

# A big answer from a free model can take minutes: wait longer.
[providers.openrouter.models."google/gemma-4-31b-it:free"]
request_timeout_secs = 1200

# Paid per use, the key is from https://platform.openai.com/api-keys.
# A ChatGPT subscription (Plus / Pro) gives no API access.
# effort is sent as reasoning_effort (none | minimal | low | medium | high), only
# when it is set: a model that does not think rejects it.
# [providers.openai]
# api_key = "sk-..."

# ------------------------------------------------------------------ prompts --
# Edit them here, no rebuild needed. Placeholders in user_template:
#   {{now}} {{lookback_hours}} {{post_count}} {{channel_count}} {{posts}}
#
# This part is shared by all themes. The system prompt and the title of each
# digest are in its [[themes]] block below.
[prompts]
user_template = """
Digest for the period: the last {{lookback_hours}} h (as of {{now}}).
Collected {{post_count}} posts from {{channel_count}} channels.

{{posts}}
"""

# Instruction for the map step: when there are too many posts for one request,
# they are condensed in parts, and then the parts are merged with the same system
# prompt. This key is optional — without it the built-in text is used (summarize.rs).
# map_system = """
# You condense a PART of the channel feed — it will be merged with other parts later.
# Copy all links from the input into sources exactly, do not drop anything.
# """

# ------------------------------------------------------------------- themes --
# At least one theme is needed.
# A theme is its own digest: its own channels, its own system prompt, its own
# title. The themes run one after another, in the order of the blocks here, on the
# same schedule. They know nothing about each other: a channel can be in several
# themes, and then its news is in each of those digests.
#
#   tag         — one word of small letters, digits, _ or -. It names the theme
#                 in commands: /add dev @channel, /run dev, /list.
#                 Do not rename a tag later: the channels are stored under it.
#   title       — the title of the digest, needed. {{date}} and {{time}} are in
#                 the time zone from [schedule]
#   system      — the system prompt of the theme, needed
#   destination — where this digest goes: "bot" or "@channel". Not set: the
#                 destination from [telegram].
#
# /add without a tag adds the channel to the first theme. Channels that were
# added before themes go to the first theme too.

[[themes]]
tag   = "world"
title = "📰 Digest World News {{date}} {{time}}"
# destination = "@my_world_channel"
system = """
You are the editor of a daily news digest made from Telegram channels.

You get a list of posts. You answer with a list of topics.

How to work, step by step:
1. Read all the posts first.
2. Put posts about the same event together. ONE EVENT = ONE TOPIC, also when
   several channels write about it. A post marked "repost from: …" and the
   original post are the same event.
3. Write one topic for every notable event:
   - title: names the event, like a headline. Good: "Fire at a plant in Texas".
     Bad: "Incidents".
   - summary: 1–3 sentences with the facts: who, what, where, numbers.
   - sources: every post about this event.
4. Order the topics by importance: the most important first.

Rules:
- A topic is an event, not a category. An accident in Texas and a crime in
  Belarus are two topics, not one topic "Incidents".
- Do not cut the digest short. A day with 100+ posts usually has 20–40 topics.
- Each event is in the digest only once.
- Use only facts from the posts. No opinions, no filler, no advertising language.
- Write the titles and the summaries in Russian, also when the posts are in
  another language.
"""

[[themes]]
tag   = "dev"
title = "💻 Digest DEV {{date}} {{time}}"
# destination = "@my_dev_channel"
system = """
You are the editor of a digest for software developers. It is made from Telegram
channels about programming: Java, Go, Rust, DevOps and others.

You get a list of posts. You answer with a list of topics.

How to work, step by step:
1. Read all the posts first.
2. Throw away the advertising. A post gives NO topic if it only sells or
   promotes something: an offer to buy a course, to sign up for a course, a
   school, a bootcamp, an intensive, a paid webinar or mentoring; a promo code, a
   discount, a giveaway; "subscribe to our other channel". If a useful post ends
   with such an offer, keep the useful part and leave the offer out.
3. Put posts about the same thing together. ONE NEWS ITEM = ONE TOPIC, also when
   several channels write about it. A post marked "repost from: …" and the
   original post are the same item.
4. Write one topic for every useful item:
   - title: names the thing. Good: "PostgreSQL 19 is released". Bad: "Database
     news".
   - summary: 1–3 sentences: what is new, for whom it matters, versions and
     numbers. For an article or a tool: what it is about and what you learn.
   - sources: every post about this item.
5. A coding task (LeetCode and the like) is its own topic. The title starts with
   "Задача:" and has the name of the task. The summary gives the task in 1–2
   sentences, and the idea of the solution if the post has it.
6. Order the topics: releases and important news first, then articles and tools,
   then tasks.

Rules:
- A topic is one item, not a category. A Go release and a Rust release are two
  topics, not one topic "Releases".
- Do not cut the digest short: every useful item gets its topic.
- Each item is in the digest only once.
- Use only facts from the posts. No opinions, no filler, no advertising language.
- Keep the names of languages, tools and versions as they are written.
- Write the titles and the summaries in Russian, also when the posts are in
  another language.
"""
