# tg-digest — all settings in one place.
#
# The normal place for this file is the container volume: ./data/config.toml on
# the host, /data/config.toml inside. To run locally:
#     cargo run -- --config config.toml preview
#
# config.toml is in .gitignore — it never goes into the repository.
# All settings come only from this file, the secrets too.
#
# Channels are not set here: add them with /add in the chat with the bot. The list is
# stored in the database.

# The folder with all state: the database and both session files. In the
# container it is the /data volume. For a local run: "data".
# The three file names below are optional: without them the files are
# digest.db, tg.session and bot.session.
data_dir = "/data"

# Database: channels, cursors, journal of runs and digest parts.
# It is in the same volume as the session: an unfinished run must survive
# a container restart, together with the text of its parts and their random_id.
# A file name inside data_dir, not a path.
# db_file = "digest.db"

# Which model writes the digest, as "provider/model" from [providers] below.
# /model in the bot switches it; this is the default.
model = "gemini/gemini-3.8-flash"

# Where to switch when the model is overloaded or its limit is used up, in this
# order. The bot asks the owner first (/fallback), nothing switches by itself.
fallback = ["openrouter/google/gemma-4-31b-it:free", "anthropic/claude-haiku-5-5"]

# ------------------------------------------------------------------ schedule --
[schedule]
# IANA time zone name. Every theme cron is calculated in it, and the date in the
# digest title uses it. Without it "09:00" means UTC.
# Each theme has its own `cron` in [[themes]] (no shared schedule.cron).
timezone = "America/New_York"

# If a slot was missed (the container was stopped, the computer was asleep),
# run at once on start, do not wait for the next one. This is normal in a container.
catch_up = true

# Run once right after `serve` starts. Useful for debugging.
run_on_start = false

# ----------------------------------------------------------------- telegram --
[telegram]
# Where the bot posts the digest: "bot" = the chat with the bot (you see it there),
# or "@my_channel" — then the bot must be an admin of that channel.
# A theme can have its own place: `destination` in its [[themes]] block.
destination = "bot"

# /add starts a channel from its newest message. This window is used after
# /reset, and for a channel whose newest message could not be read on /add.
# Time window for a channel with no cursor yet and for a channel after
# /reset. For other channels the limit is the cursor: a channel that failed for
# three days gives all three days when it works again.
lookback_hours = 24

# A SAFETY LIMIT against reading the whole history, not a cut of the digest. If a
# channel hits the limit before it reaches the cursor, it is excluded from the run
# completely, its cursor does not move and you get a notification. No posts are
# lost silently.
max_posts_per_channel = 1000

# Posts shorter than this are dropped (stickers, "media only", one-word reactions)
min_post_chars = 30

# Pause before the next channel in each parallel lane, to avoid FLOOD_WAIT
pause_between_channels_ms = 1500

# How many channels are read at the same time. More is faster, but too many can
# bring FLOOD_WAIT from Telegram.
parallel_channels = 5

# After a delivered digest, mark the posts as read in Telegram for your account, so
# the channels do not keep unread counters. Only your account: other users keep
# their own read state.
mark_read = true

# For how many hours the daemon itself retries an undelivered digest. This is a
# retry policy, not a safety limit: Telegram does not document how long it keeps
# random_id for deduplication. After this window the owner retries with /resume.
publish_retry_window_hours = 2

# ------------------------------------------------------------- telegram.app --
# The personal account: it only reads. It collects posts, resolves /add and
# refreshes channel names. The bot logs in with the same api_id and api_hash.
[telegram.app]
# Get them at https://my.telegram.org → API development tools
api_id   = 0
api_hash = ""
# Account phone number in international format. You can keep dashes, spaces and
# brackets — the service removes them before it calls Telegram.
phone    = "+1-000-00-00"

# Session file (SQLite). The `tg-digest login` command creates it.
# WARNING: it gives full access to the account — do not commit it or copy it anywhere.
# A file name inside data_dir, not a path.
# session_file = "tg.session"

# ------------------------------------------------------------- telegram.bot --
# The bot you talk to: you write commands to it, and it writes back the replies,
# the digests and the notifications. The personal account above still reads the
# channels (a bot cannot read channels where it is not an admin).
#
# Create a bot with @BotFather (/newbot) and paste its token here. Then open the
# bot in Telegram and send it /start once: a bot can write to you only after that.
# Only the account from [telegram.app] may give the bot commands. Everyone else is
# ignored.
[telegram.bot]
token = ""

# Bot session (SQLite), created on the first start. No login is needed for a bot.
# A file name inside data_dir, not a path.
# session_file = "bot.session"

# ---------------------------------------------------------------- providers --
# Each provider needs only its key. `model` and `fallback` at the top of this file
# name any model the provider has, as "provider/model id" (the full id, as it is).
# The service reads each provider's model list from its API (once a day) and takes
# the limits from there: the input size and the longest answer. In the bot,
# /models <provider> shows the list and /model switches to any model in it.
#
# A table [providers.<provider>.models."<id>"] is needed only to change a setting
# by hand. A setting can also be set for the whole provider. The order is: the model
# table, the provider's model list, the provider table, the defaults.
#   max_tokens           — the longest answer, in tokens
#   max_input_chars      — above this many characters the posts are condensed in
#                          parts first (map-reduce): more requests, each one smaller.
#                          Not set, it comes from the context window of the model.
#                          A model with a window of a million tokens then gets the
#                          whole feed in one request, and one digest of everything
#                          can be too long to write: set it by hand (400000 is a
#                          good start). If the answer is cut anyway, the service
#                          splits the input and asks again by itself
#   request_timeout_secs — how long to wait for one answer (default 600)
#   effort               — anthropic: low | medium | high | xhigh | max;
#                          openai: none | minimal | low | medium | high
#                          (openrouter: not sent on the first request; a stub
#                          retry keeps reasoning on at effort low, and raises
#                          max_tokens when thinking used almost all the output)
#   reasoning            — openrouter only: the model thinks before it answers;
#                          slower, and the thinking counts in max_tokens.
#                          A model that always thinks (glm-5.3-flash) gets it on
#                          even with reasoning = false
#   sort                 — openrouter only: how to choose the host of a model:
#                          price | throughput | latency (not set: OpenRouter
#                          balances price and uptime)
#   ignore               — openrouter only: hosts that never get the request,
#                          e.g. ["Relace", "OpenInference"]
#   quantizations        — openrouter only: only hosts that run the model in one
#                          of these forms, e.g. ["fp8", "bf16"]. The cheapest hosts
#                          often run fp4, and it can answer a big feed with nothing
# Providers you do not use can be left out.

[providers.anthropic]
api_key = "sk-ant-..."
effort  = "high"

# The key is from https://aistudio.google.com/apikey (free tier with limits).
# A Gemini app subscription (AI Pro / Ultra) gives no API access.
[providers.gemini]
api_key = "..."

# One key for many models: https://openrouter.ai/keys
# Free models have ids that end with ":free" (/models openrouter free in the bot).
# They have low daily limits and can be busy too. Only models with response_format
# are in the list. If a model has no strict JSON schema (structured_outputs), the
# service asks for a JSON object and puts the schema in the prompt.
#
# DeepSeek V4.1 Flash thinks before it answers, and the thinking counts in
# max_tokens. If the thinking uses almost all of the output, the JSON comes
# back with empty title and summary fields. Those topics are dropped. The
# service asks once more with reasoning still on, at low effort, and with a
# higher max_tokens so the JSON has room. If that answer is stubs too, nothing
# is posted and the cursors stay.
[providers.openrouter]
api_key = "sk-or-..."
# One model has many hosts, and their prices differ up to five times.
sort    = "price"
# The cheapest hosts run strongly compressed models (fp4). Keep them out.
quantizations = ["fp8", "bf16", "fp16"]

# A big answer from a free model can take minutes: wait longer.
[providers.openrouter.models."google/gemma-4-31b-it:free"]
request_timeout_secs = 1200

# Example: keep reasoning on. The stub retry raises max_tokens by itself when
# thinking used almost all of the output.
# [providers.openrouter.models."deepseek/deepseek-v4.1-flash"]
# reasoning = true
# max_tokens = 40000

# Paid per use, the key is from https://platform.openai.com/api-keys.
# A ChatGPT subscription (Plus / Pro) gives no API access.
# effort is sent as reasoning_effort (none | minimal | low | medium | high), only
# when it is set: a model that does not think rejects it.
# [providers.openai]
# api_key = "sk-..."

# ----------------------------------------------------------------- providers.cli --
# Agent CLI by subscription (no API key). Model key: cli/<preset> or
# cli/<preset>/<model>. Every enabled preset must turn off all tools of the CLI
# (file read, shell, network, MCP). A read-only mode is not enough: a post can
# ask the agent to read /data/tg.session. Presets that cannot do that stay
# commented with a WARNING. Uncomment only the presets you need.
#
# Install CLIs into the volume (not the image):
#   docker compose run --rm tg-digest agents install claude
# Login example:
#   docker compose run --rm -it tg-digest exec claude setup-token
#
# Risk: channel posts are foreign text. If tools stay on, a post can leak secrets
# into the digest. A second check refuses a digest that contains a config secret.

# # Tested with Claude Code 2.1.331.
# # --tools "" turns off the built-in tools. --strict-mcp-config without
# # --mcp-config turns off all MCP servers. Do not use --bare: it does not read
# # the subscription (OAuth) login.
# # Write "safe: all tools are off; the injection test passed with <version>"
# # only after the injection test in the plan.
# [providers.cli.presets.claude]
# command = ["claude", "-p", "--output-format", "json",
#            "--json-schema", "{schema}", "--tools", "", "--strict-mcp-config",
#            "--no-session-persistence"]
# model_args = ["--model", "{model}"]
# allowed_models = ["opus", "sonnet", "haiku"]
# output = "json"
# answer = "/structured_output"
# error = "/is_error"
# error_text = "/result"
# input_tokens = "/usage/input_tokens"
# output_tokens = "/usage/output_tokens"
# max_input_chars = 600000
# request_timeout_secs = 1800
# login = "claude setup-token"
# env = { DISABLE_AUTOUPDATER = "1" }
#
# [providers.cli.presets.claude.models."haiku"]
# max_input_chars = 300000

# # Tested with codex-cli 0.172.0.
# # WARNING: codex has no mode without tools. -s read-only still lets it read
# # files, so a post in a channel can make it read /data/tg.session. Keep this
# # preset off until codex has such a mode and the injection test passes.
# # [providers.cli.presets.codex]
# # command = ["codex", "exec", "--skip-git-repo-check", "-s", "read-only",
# #            "--output-schema", "{schema_file}"]
# # model_args = ["-m", "{model}"]
# # max_input_chars = 600000
# # request_timeout_secs = 1800
# # login = "codex login --device-auth"

# # Tested with agy 1.5.16.
# # WARNING: agy has no flag that turns off its file-read tools. A post in a
# # channel can make it read /data/tg.session. Keep this preset off until agy
# # has such a mode (check --sandbox and --settings first).
# # [providers.cli.presets.agy]
# # command = ["agy", "--print", "--input-format", "text", "--disable-slash-commands",
# #            "--output-format", "json", "--json-schema", "{schema}",
# #            "--print-timeout", "1800s"]
# # model_args = ["--model", "{model}"]
# # answer = "/structured_output"
# # input_tokens = "/usage/input_tokens"
# # output_tokens = "/usage/output_tokens"
# # max_input_chars = 600000
# # request_timeout_secs = 1860

# # Tested with cursor-agent 2026.11.22-e9042b2.
# # WARNING: cursor-agent --print enables all tools (read, write, shell). It has
# # no flag that turns them off; --mode ask|plan and --sandbox are read-only at
# # most. A post in a channel can make it read /data/tg.session. Keep this preset
# # off until a no-tools mode exists and the injection test passes.
# # [providers.cli.presets.cursor]
# # command = ["cursor-agent", "--print", "--output-format", "json",
# #            "--trust", "--workspace", "."]
# # model_args = ["--model", "{model}"]
# # answer = "/result"
# # max_input_chars = 600000
# # request_timeout_secs = 1800
# # login = "env NO_OPEN_BROWSER=1 cursor-agent login"
# # env = { CURSOR_API_KEY = "..." }

# # Tested with opencode 2.4.1.
# # Agent "tg-digest-no-tools" denies every tool and stops after one step. It
# # comes from OPENCODE_CONFIG_CONTENT below. The server reads that variable, not
# # the client, so --standalone is required. Never add --auto.
# # Write "safe: ..." only after the injection test.
# [providers.cli.presets.opencode]
# command = ["opencode", "run", "--standalone", "--agent", "tg-digest-no-tools",
#            "--format", "json", "--archived"]
# model_args = ["--model", "{model}"]
# output = "events"
# event_type = "/type"
# answer_event = "text"
# answer = "/part/text"
# usage_event = "step_finish"
# input_tokens = "/part/tokens/input"
# output_tokens = "/part/tokens/output"
# error_event = "error"
# error_text = "/error/message"
# max_input_chars = 600000
# request_timeout_secs = 1800
# login = "opencode auth login"
# [providers.cli.presets.opencode.env]
# OPENCODE_DISABLE_AUTOUPDATE = "1"
# OPENCODE_CONFIG_CONTENT = '''{"agents":{"tg-digest-no-tools":{"mode":"primary","steps":1,
#   "system":"You turn a Telegram feed into one JSON digest. Answer with JSON only.",
#   "permissions":[{"action":"*","resource":"*","effect":"deny"}]}}}'''

# ------------------------------------------------------------------ prompts --
# Edit them here, no rebuild needed. Placeholders in user_template:
#   {{now}} {{lookback_hours}} {{post_count}} {{channel_count}} {{posts}}
#
# This part is shared by all themes. The system prompt and the title of each
# digest are in its [[themes]] block below.
[prompts]
user_template = """
Digest for the period: the last {{lookback_hours}} h (as of {{now}}).
Collected {{post_count}} posts from {{channel_count}} channels.

{{posts}}
"""

# Instruction for the map step: when there are too many posts for one request,
# they are condensed in parts, and then the parts are merged with the same system
# prompt. This key is optional — without it the built-in text is used (summarize.rs).
# map_system = """
# You condense a PART of the channel feed — it will be merged with other parts later.
# Copy all links from the input into sources exactly, do not drop anything.
# """

# ------------------------------------------------------------------- themes --
# At least one theme is needed.
# A theme is its own digest: its own channels, its own system prompt, its own
# title and its own cron. Themes know nothing about each other: a channel can be
# in several themes, and then its news is in each of those digests. When two
# themes share a slot they run one after another, in the order here.
#
#   tag         — one word of small letters, digits, _ or -. It names the theme
#                 in commands: /add dev @channel, /run dev, /list.
#                 Do not rename a tag later: the channels are stored under it.
#   title       — the title of the digest, needed. {{date}} and {{time}} are in
#                 the time zone from [schedule]
#   system      — the system prompt of the theme, needed
#   cron        — 5-field cron for this theme, needed (minute hour day month weekday)
#   destination — where this digest goes: "bot" or "@channel". Not set: the
#                 destination from [telegram].
#
# /add without a tag adds the channel to the first theme. Channels that were
# added before themes go to the first theme too.

[[themes]]
tag   = "world"
title = "📰 Digest World News {{date}} {{time}}"
cron  = "0 9 * * *"             # every day at 09:00; "0 7,13,17,21 * * *" is four times a day
# destination = "@my_world_channel"
system = """
You are the editor of a daily digest of WORLD news made from Telegram channels.

You get a list of posts. You answer with a list of topics.

How to work, step by step:
1. Read all the posts first.
2. Throw away every post from the list "What to throw away" below.
3. Put the remaining posts about the same event together. ONE EVENT = ONE TOPIC,
   also when several channels write about it. A post marked "repost from: …"
   and the original post are the same event.
4. Write one topic for every notable event:
   - title: names the event, like a headline. Good: "Fire at a plant in Texas".
     Bad: "Incidents".
   - summary: 1–3 sentences with the facts: who, what, where, numbers.
   - sources: every post about this event.
5. Order the topics by importance: the most important first.

What to throw away — such a post gives NO topic (the only exception is below):
- Anything happening in Russia, Moscow, Saint Petersburg, Moscow region
  (Подмосковье) or any Russian city or region: politics, courts, laws,
  officials, police cases, explosions, attacks, accidents, fires, deaths,
  suicides, crime, weather and snowstorms, health care, medicines, schools,
  prices, budgets and social programs.
  Examples to throw away: "Snowfall in Moscow will last another day";
  "A woman and child died after falling from a balcony in Lyubertsy".
- Anything about Russian people, officials, companies, banks, media (such as
  TASS or RT), or the Russian economy, inside Russia or abroad. Russian
  companies are, for example, Yandex, Sber, VK, Gazprom, Rosneft, Lukoil,
  Rosatom, Aeroflot, Kaspersky, Ozon, Wildberries, MTS, T-Bank: throw away
  their news, deals, products, money and staff.
  Example: "Russian cancer patients get no medicines after the budget of the
  cancer program was cut" — throw it away.
- Sanctions against Russia or Russian companies/people, seized assets, and
  decisions of foreign countries or international groups about Russia.
- Russian diplomacy, statements, demands, meetings or conflicts with any
  country or group (the US, the EU, NATO, the UN, BRICS, CIS, CSTO, EAEU).
- Anything happening in Ukraine or in its regions, and anything about
  Ukrainian people, officials, companies or the Ukrainian economy, inside
  Ukraine or abroad.
- The war between Russia and Ukraine and everything around it: strikes,
  shelling, front-line news, casualties, drones, weapons, war funding,
  sabotage, prisoner exchanges, peace talks and peace plans.
- Announcements: live streams, broadcasts, podcasts, interviews, shows and
  events that will come ("watch our live stream at 19:00", "a new episode
  tonight"), and calls to subscribe, donate, buy or take part.
- Internal politics of other countries, except the US, Belarus and Poland:
  elections and appointments of speakers, ministers, governors, mayors and
  party leaders, ratings of politicians, statements and quarrels of local
  politicians, court cases against local politicians. Keep such a story only
  when it changes things for other countries: a new head of state or
  government, a coup, a war.
- Small local events of other countries, except the US, Belarus and Poland:
  local court cases, small crime, accidents with few victims, missing people,
  lottery wins, local business and property news.
- Celebrity and royal news: stars and their families, their court cases,
  looks, clothes, parties, awards and quarrels.
- Small news about games, films and series: trailers, ratings, budgets,
  reviews, staff changes, game updates and events. Keep only a big event,
  such as a game or film release that the whole world talks about.
- Small IT news: releases of apps and programs, new features of apps,
  rumours and leaks about phones and gadgets, device reviews. Keep only big
  tech events: a global outage, a big deal or IPO, a new head of a big
  company.
- Service posts and digests: exchange rates, weather forecasts, "main news by
  9:00", press reviews, morning or evening news roundups and digests of a
  channel, lists of the best prompts, trading signals and bets.
  Example to throw away: "Meduza published the main news of November 18".
- Ads and calls: advertising and sponsored posts, courses, webinars,
  meetings with authors, brand ambassadors, quizzes and tests, a search for
  people for a story, podcasts.
- Opinions and explainers with no new event: columns, analysis, interviews,
  advice ("how to …"), answers to "why …", reviews of films and books.
- Official news of the Belarus state media (such as ONT or BELTA):
  greetings, protocol meetings, commissions, inspections, daily police
  statistics.
If a post has Russia, Russians, Putin, Moscow, Ukraine, Ukrainians, Zelensky,
Kyiv or the war in Ukraine as a main part of the story, leave it out
completely — even if it also involves the US, Europe, NATO or foreign
companies, and even if a whole channel has only such posts. If you are not
sure, leave it out.
The only exception: keep a curious story from any country, Russia and Ukraine
too. This is a strange, absurd or funny event with no politics and no war:
an unusual animal, a funny mistake of a person or a shop, a strange court case about a
small thing, an odd record. Example: "A man tried to pay for a car with a bag
of coins" — keep it. A story about the war, sanctions or politics is never
curious: throw it away.

Rules:
- A topic is an event, not a category. An accident in Texas and a crime in
  Brazil are two topics, not one topic "Incidents".
- Never write an overview topic: "Main events of the day", "News in brief",
  "Summary of all news" and the like. Such a topic has no real event, it only
  collects the sources of other topics. Every topic is one event, and its
  sources are only the posts about this event.
- A channel with only thrown-away posts gets NO topic. Do not make an overview
  topic to cover such channels.
- Do not cut the digest short. Include all notable world events that are not
  thrown away above.
- Each event is in the digest only once.
- Use only facts from the posts. No opinions, no filler, no advertising language.
- Write the titles and the summaries in Russian, also when the posts are in
  another language.
"""

[[themes]]
tag   = "dev"
title = "💻 Digest DEV {{date}} {{time}}"
cron  = "0 18 * * *"            # this theme only, at 18:00
# destination = "@my_dev_channel"
system = """
You are the editor of a digest for software developers. It is made from Telegram
channels about programming: Java, Go, Rust, DevOps and others.

You get a list of posts. You answer with a list of topics.

How to work, step by step:
1. Read all the posts first.
2. Throw away the advertising. A post gives NO topic if it only sells or
   promotes something: an offer to buy a course, to sign up for a course, a
   school, a bootcamp, an intensive, a paid webinar or mentoring; a promo code, a
   discount, a giveaway; "subscribe to our other channel". If a useful post ends
   with such an offer, keep the useful part and leave the offer out. A free
   download or a promo of a book or article is not advertising: keep it.
3. Throw away the news about Russia and Russian companies. A post gives NO
   topic if it is about:
   - Russia: politics, laws, officials, regions, the economy; Russian IT laws,
     bans, blocks of sites and apps, VPN, import replacement; polls and studies
     about Russian users.
   - Russian companies (Yandex, Sber, VK, Kaspersky, Ozon, Wildberries, Avito,
     MTS, T-Bank, 1C, Positive Technologies and others): their news, products,
     releases, services, data centers, hardware, deals, money, staff, events
     and conferences.
   Keep only pure technical content: a code example, a technique or an article
   about a general tool or language, whoever wrote it. If you are not sure,
   leave it out.
4. Throw away attack walkthroughs. A post gives NO topic if it teaches how to
   break into systems: CTF writeups, exploit guides, compromise walkthroughs
   (web shell, GitLab takeover, CI/CD abuse and the like), or step-by-step
   offensive security how-tos. Keep vulnerability news and defensive security.
   Keep "how it works / under the hood" explainers about tools or systems.
5. Put posts about the same thing together. ONE NEWS ITEM = ONE TOPIC, also when
   several channels write about it. A post marked "repost from: …" and the
   original post are the same item.
6. Write one topic for every useful item that has details (except the two
   grouped lists in steps 7 and 8):
   - title: names the thing. Good: "PostgreSQL 19: faster vacuum and new JSON
     functions". Bad: "Database news".
   - summary: 1–3 sentences: what is new, for whom it matters, versions and
     numbers. For an article or a tool: what it is about and what you learn.
   - sources: every post about this item.
7. Put all bare version releases into ONE topic (this is an exception to the
   one-item rule). A release is bare when the post — or a line in a release
   roundup — only says that a new version, beta or RC came out, with NO details
   about what changed or what is new in this version. Saying what kind of
   program it is ("DNS server", "load balancer", "browser", "3D map package")
   is NOT details of changes. Do not add details from outside the post.
   - If a post explains what changed or what is new in this version, give it
     its own topic as in step 6.
   - Put all bare releases into ONE topic. The title is "Новые версии" (or
     names the software and version if there is only one bare release).
   - The summary lists the programs and versions in short form (for example:
     "Вышли новые версии: Rayshader 1.0, HAProxy 3.4.9, Valkey 9.2.1.").
   - Put all posts with these bare releases in sources.
8. Put all short CVE and vulnerability notices into ONE separate topic (this is
   also an exception to the one-item rule). A notice is short when the post —
   or a line in a roundup — only says that a CVE or vulnerability was found or
   fixed (CVE ID, affected software and versions, severity, fixed version),
   with NO detailed technical story or breakdown.
   - If a post explains a vulnerability in detail (how the bug works, what
     happened in an incident, or how to defend against it — not an attack
     walkthrough from step 4), give it its own topic as in step 6.
   - Put all short CVE notices into ONE topic, separate from "Новые версии".
     The title is "Уязвимости (CVE)" (or names the software if there is only
     one CVE).
   - The summary lists each CVE ID (if given), the affected software and
     versions, and the fix if known.
   - Put all posts with these short CVE notices in sources.
9. A coding task (LeetCode and the like) is its own topic. The title starts with
   "Задача:" and has the name of the task. The summary gives the task in 1–2
