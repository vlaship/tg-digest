services:
  tg-digest:
    build: .
    image: tg-digest
    restart: unless-stopped

    # All state is in the host folder ./data, mounted as /data:
    # config.toml, tg.session, digest.db. It survives image updates and `down`.
    # tg.session gives full access to the Telegram account. It is not "just a cache".
    volumes:
      - ./data:/data

    # Secrets: TG_API_ID, TG_API_HASH, TG_PHONE, ANTHROPIC_API_KEY from .env next to
    # this file (copy .env.example). Each one overrides the value from config.toml;
    # an empty value counts as "not set". .env is in .gitignore and .dockerignore.
    env_file:
      - path: .env
        required: false

    # Anything not yet saved can be stopped, but sending one part must not be cut.
    # 30 seconds is enough to finish the current part and close the transaction.
    stop_grace_period: 30s

    # Docker collects the logs; the container writes no log files.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
