services:
  tg-digest:
    build: .
    image: tg-digest
    restart: unless-stopped

    # All state is here: config.toml, tg.session, digest.db.
    # tg.session gives full access to the Telegram account. It is not "just a cache".
    volumes:
      - ./data:/data

    # It is easier to keep secrets in the environment than in a file in the volume:
    # each variable overrides the value from config.toml.
    # A name without `=` is passed only if it is set on the host.
    # Otherwise an empty string would replace the key from the config.
    environment:
      - TG_API_ID
      - TG_API_HASH
      - TG_PHONE
      - ANTHROPIC_API_KEY

    # Anything not yet saved can be stopped, but sending one part must not be cut.
    # 30 seconds is enough to finish the current part and close the transaction.
    stop_grace_period: 30s

    # Docker collects the logs; the container writes no log files.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
