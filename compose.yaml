services:
  tg-digest:
    # BUILD_TIME and GIT_SHA put the version into /status; without them it is "dev".
    # For a local build, if you want:
    # BUILD_TIME=$(date -u +%Y%m%d-%H%M%S) GIT_SHA=$(git rev-parse HEAD) docker compose up -d --build
    build:
      context: .
      args:
        BUILD_TIME: ${BUILD_TIME:-}
        GIT_SHA: ${GIT_SHA:-}
    # The image CI publishes from main: `docker compose pull` takes the new one.
    # `docker compose up -d --build` builds it here from the source instead.
    image: ghcr.io/vlaship/tg-digest:latest
    restart: unless-stopped

    # A small VM runs other services too. If memory grows, only this container is
    # killed and restarted; the host does not hang.
    mem_limit: 128m
    # glibc makes many malloc arenas; in a long-running process they keep memory.
    environment:
      MALLOC_ARENA_MAX: "2"

    # All settings and state are in the host folder ./data, mounted as /data:
    # config.toml (with the secrets), tg.session, digest.db. It survives image updates
    # and `down`. ./data is in .gitignore and .dockerignore.
    # tg.session gives full access to the Telegram account. It is not "just a cache".
    volumes:
      - ./data:/data

    # Anything not yet saved can be stopped, but sending one part must not be cut.
    # 30 seconds is enough to finish the current part and close the transaction.
    stop_grace_period: 30s

    # Docker collects the logs; the container writes no log files.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
